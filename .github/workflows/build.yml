# Builds Altiora Confidence for Mac (Apple chips + Intel) and Windows on GitHub's machines.
# Run it: GitHub -> Actions -> "Build Altiora Confidence" -> Run workflow.
# Pushing a tag like v1.1 also publishes the files as a Release.
# The project files can sit at the top of the repository or inside one sub-folder.
name: Build Altiora Confidence

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  mac:
    name: Mac (${{ matrix.label }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            label: apple-silicon
          - runner: macos-15-intel
            label: intel
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Build the app
        run: |
          SCRIPT="$(find . -name build_mac.sh -not -path './.git/*' | head -1)"
          if [ -z "$SCRIPT" ]; then
            echo "::error::build_mac.sh not found. Upload all the project files (app, packaging, build_mac.sh, main.py...) to the repository."
            exit 1
          fi
          cd "$(dirname "$SCRIPT")"
          echo "Project folder: $PWD"
          bash build_mac.sh
      - name: Show the build log if something failed
        if: failure()
        run: find . -name build-mac.log -exec tail -60 {} \; || true
      - uses: actions/upload-artifact@v4
        with:
          name: Altiora-Confidence-mac-${{ matrix.label }}
          path: "**/output/*.dmg"
          if-no-files-found: error

  windows:
    name: Windows
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install Inno Setup (makes the installer)
        run: choco install innosetup -y --no-progress
      - name: Build the installer
        shell: pwsh
        run: |
          $script = Get-ChildItem -Recurse -Filter build_windows.bat | Select-Object -First 1
          if (-not $script) {
            Write-Output "::error::build_windows.bat not found. Upload all the project files to the repository."
            exit 1
          }
          Set-Location $script.DirectoryName
          Write-Output "Project folder: $PWD"
          cmd /c build_windows.bat
          exit $LASTEXITCODE
      - name: Show the build log if something failed
        if: failure()
        shell: pwsh
        run: Get-ChildItem -Recurse -Filter build.log | ForEach-Object { Get-Content $_.FullName -Tail 60 }
      - uses: actions/upload-artifact@v4
        with:
          name: Altiora-Confidence-windows
          path: "**/output/*"
          if-no-files-found: error

  release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [mac, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: files
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: files/**/*
