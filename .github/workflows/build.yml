# Builds Altiora Confidence for Mac (Apple chips + Intel) and Windows on GitHub's machines.
# Run it: GitHub -> Actions -> "Build Altiora Confidence" -> Run workflow.
# Pushing a tag like v1.1 also publishes the files as a Release.
name: Build Altiora Confidence

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  mac:
    name: Mac (${{ matrix.label }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            label: apple-silicon
          - runner: macos-15-intel
            label: intel
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build the app
        run: bash build_mac.sh
      - name: Show the build log if something failed
        if: failure()
        run: cat build/build-mac.log || true
      - uses: actions/upload-artifact@v4
        with:
          name: Altiora-Confidence-mac-${{ matrix.label }}
          path: output/*.dmg
          if-no-files-found: error

  windows:
    name: Windows
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Inno Setup (makes the installer)
        run: choco install innosetup -y --no-progress
      - name: Build the installer
        shell: cmd
        run: call build_windows.bat
      - name: Show the build log if something failed
        if: failure()
        shell: cmd
        run: type build\build.log
      - uses: actions/upload-artifact@v4
        with:
          name: Altiora-Confidence-windows
          path: output/*
          if-no-files-found: error

  release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [mac, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: files
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: files/*
